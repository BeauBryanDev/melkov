name: backend tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest on app/
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU torch first
        # sentence-transformers pulls torch, and the default Linux wheel is the
        # CUDA build: 3.5 GB of NVIDIA runtime this project never uses.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install dependencies
        # The uplink is the usual failure here, not a version clash.
        run: pip install --timeout 120 --retries 10 -r requirements.txt -r requirements-dev.txt

      - name: Run the test suite
        # No secrets and no network: the suite fakes Anthropic, the HF Space,
        # NVIDIA FLUX, the MET API and the embedding model.
        run: python -m pytest --cov=app --cov-report=term-missing
